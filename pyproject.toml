[project]
name = "qespace_cef"
version = "1.3.0"
description = "Tools for analysis of physical properties arising from crystal-field Hamiltonian."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
        {name = 'Michal Stekiel', email = 'michal.stekiel@frm2.tum.de'},
        {name = 'Petr Čermák'},
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.4",
]

[dependency-groups]
dev = [
    "furo>=2025.12.19",
    "pytest>=9.0.2",
    "ruff>=0.17.6",
    "sphinx>=9.1.0",
]
# Only for the experimental scripts in qespace_cef/symbolic: uv sync --group symbolic
symbolic = [
    "sympy>=1.14.0",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
# Experimental scripts and copied reference code, kept as they are.
extend-exclude = ["qespace_cef/symbolic", "tests/reference"]

[tool.ruff.lint]
# Pyflakes, the basic pycodestyle errors and import sorting; nothing stricter.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Re-exports without __all__ until the public API is defined (AUDIT A4).
"qespace_cef/__init__.py" = ["F401", "F403"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets the tests import the reference implementations in tests/reference.
pythonpath = ["tests"]
markers = ["perf: performance stubs, skipped by default (run with -m perf -s)"]
addopts = "-m 'not perf'"
